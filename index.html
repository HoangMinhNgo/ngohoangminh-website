<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abc.io.vn</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#2563eb,#06b6d4);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .card{
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(10px);
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:90%;
      max-width:500px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
    }

    p{
      font-size:18px;
      opacity:.95;
      margin:10px 0;
    }

    .status{
      display:inline-block;
      margin-top:20px;
      padding:10px 18px;
      background:#22c55e;
      border-radius:999px;
      font-weight:bold;
    }

    footer{
      margin-top:30px;
      font-size:14px;
      opacity:.8;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🎉 Thành công!</h1>

  <p>Website của bạn đã chạy trên</p>

  <h2>ngohoangminh.id.vn</h2>

  <div class="status">
    GitHub Pages hoạt động
  </div>

  <footer>
    Deploy bằng GitHub Pages • 2026
  </footer>

</div>

</body>
</html>
